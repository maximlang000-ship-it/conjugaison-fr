<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conjugaison FR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conjugaison FR">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263348;
      --border: #334155;
      --blue: #5b7fe8;
      --blue-dim: rgba(91,127,232,0.15);
      --blue-border: rgba(91,127,232,0.35);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.1);
      --green-border: rgba(34,197,94,0.4);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.1);
      --red-border: rgba(239,68,68,0.4);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.12);
      --amber-border: rgba(245,158,11,0.4);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --irregular: #f87171;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px 32px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ──────────────────────────────────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0 10px;
    }
    .header-title { font-size: 1rem; font-weight: 700; color: var(--blue); letter-spacing: 0.04em; }
    .header-meta  { font-size: 0.85rem; color: var(--text-muted); }

    .progress-bar {
      height: 4px; background: var(--surface); border-radius: 2px;
      margin-bottom: 18px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--blue); border-radius: 2px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    /* ── QUESTION CARD ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px 24px 24px;
      margin-bottom: 16px;
      text-align: center;
    }
    .tense-chip {
      display: inline-block;
      background: var(--blue-dim);
      color: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    .verb-name {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.1;
    }
    .person-label {
      display: inline-block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      margin-top: 4px;
    }

    /* ── SECTION LABEL ──────────────────────────────────── */
    .section-label {
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    /* ── GROUP BUTTONS ──────────────────────────────────── */
    .group-buttons {
      display: flex; gap: 8px;
      margin-bottom: 16px;
    }
    .btn-group {
      flex: 1; padding: 12px 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 0.88rem; font-weight: 700;
      cursor: pointer; text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-group .group-sub {
      display: block;
      font-size: 0.72rem; font-weight: 400;
      margin-top: 3px; color: var(--text-dim);
    }
    .btn-group.selected {
      border-color: var(--blue);
      background: var(--blue-dim);
      color: var(--blue);
    }
    .btn-group.selected .group-sub { color: var(--blue); opacity: 0.7; }

    /* ── INPUT ──────────────────────────────────────────── */
    #answer-input {
      width: 100%;
      padding: 15px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.15rem;
      font-family: inherit;
      text-align: center;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    #answer-input:focus { border-color: var(--blue); }

    /* ── ACCENT BUTTONS ─────────────────────────────────── */
    .accents {
      display: flex; flex-wrap: wrap;
      gap: 6px; margin-bottom: 16px;
      justify-content: center;
    }
    .btn-accent {
      padding: 9px 11px; min-width: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 1.05rem;
      cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-accent:active { background: var(--border); }

    /* ── HELP PANEL ─────────────────────────────────────── */
    .help-panel {
      background: #0c1a35;
      border: 1px solid var(--blue-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      line-height: 1.65;
      color: #cbd5e1;
      display: none;
      animation: slideDown 0.2s ease;
    }
    .help-panel.visible { display: block; }

    .help-tense-title {
      font-weight: 800; font-size: 0.95rem; color: var(--blue);
      margin-bottom: 8px; padding-bottom: 8px;
      border-bottom: 1px solid var(--blue-border);
    }
    .help-employ { margin-bottom: 8px; color: #e2e8f0; }
    .help-rule   { margin-bottom: 8px; color: var(--amber); font-size: 0.88rem; }
    .help-ex {
      font-style: italic; color: var(--text-muted);
      font-size: 0.88rem; padding-left: 10px;
      border-left: 2px solid var(--border);
    }
    .help-warning {
      margin-top: 10px; padding: 6px 10px;
      background: rgba(245,158,11,0.1);
      border-left: 3px solid var(--amber);
      border-radius: 0 6px 6px 0;
      font-size: 0.85rem; color: var(--amber);
    }

    @keyframes slideDown {
      from { opacity:0; transform:translateY(-8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── ACTION BUTTONS ─────────────────────────────────── */
    .actions { display: flex; gap: 10px; }
    .btn-help {
      padding: 15px 18px;
      background: transparent;
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-validate {
      flex: 1; padding: 15px;
      background: var(--blue); border: none;
      border-radius: 14px;
      color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-validate.inactive { opacity: 0.5; }
    .btn-validate:not(.inactive):active { transform: scale(0.98); }

    @keyframes pulseAmber {
      0%,100% { border-color: var(--border); }
      40%      { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.25); }
    }
    .group-buttons.pulse .btn-group:not(.selected) {
      animation: pulseAmber 0.6s ease;
    }

    /* ── RESULT SCREEN ──────────────────────────────────── */
    #screen-result { display: none; }

    .result-badge {
      text-align: center;
      padding: 22px 20px 20px;
      border-radius: 20px;
      margin-bottom: 14px;
      font-size: 1.5rem; font-weight: 800;
    }
    .result-badge.correct   { background: var(--green-dim); border: 2px solid var(--green-border); color: var(--green); }
    .result-badge.incorrect { background: var(--red-dim);   border: 2px solid var(--red-border);   color: var(--red); }
    .result-badge .result-sub {
      display: block; font-size: 0.85rem; font-weight: 400; margin-top: 4px; opacity: 0.8;
    }

    .result-block {
      background: var(--surface); border-radius: 16px;
      padding: 16px; margin-bottom: 12px;
    }
    .result-block-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .result-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 8px; padding: 6px 0;
    }
    .result-row + .result-row { border-top: 1px solid var(--border); }
    .result-row-label { color: var(--text-dim); font-size: 0.88rem; }
    .result-row-val   { font-weight: 700; font-size: 0.95rem; }
    .ok { color: var(--green); }
    .ko { color: var(--red); }

    /* Group explanation */
    .group-explain {
      background: var(--surface2); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px;
      font-size: 0.88rem; line-height: 1.55; color: #cbd5e1;
    }
    .group-explain-label { font-weight: 700; color: var(--blue); margin-bottom: 5px; font-size: 0.85rem; }

    /* Tense explanation */
    .tense-explain {
      background: #0c1a35;
      border: 1px solid var(--blue-border);
      border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px;
      font-size: 0.88rem; line-height: 1.6; color: #cbd5e1;
    }
    .tense-explain .help-tense-title {
      font-size: 0.88rem; margin-bottom: 6px; padding-bottom: 6px;
    }

    /* Card back */
    .card-back-section {
      background: var(--surface); border-radius: 16px;
      padding: 20px; margin-bottom: 12px;
    }
    .card-back-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .card-back-content { font-size: 0.95rem; line-height: 1.7; color: #e2e8f0; }
    .card-back-content table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .card-back-content td { padding: 5px 14px 5px 0; font-size: 0.98rem; }
    .card-back-content b { font-weight: 800; }
    .card-back-content .anki-tip { color: var(--text-muted); font-size: 0.87em; }
    .card-back-content .anki-employ {
      background: #0c1a35;
      border-left: 3px solid var(--blue);
      border-radius: 0 8px 8px 0;
      padding: 8px 12px; margin: 10px 0;
      font-size: 0.88em; color: #cbd5e1;
    }
    .card-back-content .anki-employ b { color: var(--blue); }
    .card-back-content .irreg { color: var(--irregular); }

    /* Result action row — fixée en bas d'écran */
    .result-actions {
      display: flex; gap: 10px;
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: 480px; margin: 0 auto;
      padding: 10px 16px 20px;
      background: linear-gradient(transparent, var(--bg) 30%);
      z-index: 10;
    }
    /* Espace pour que le contenu ne passe pas sous la barre fixe */
    #screen-result { padding-bottom: 90px; }
    .btn-difficult {
      flex: 1; padding: 14px;
      background: transparent;
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .btn-difficult.marked {
      border-color: var(--amber-border);
      background: var(--amber-dim);
      color: var(--amber);
    }
    .btn-next {
      flex: 2; padding: 14px;
      background: var(--blue); border: none;
      border-radius: 14px;
      color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next:active { transform: scale(0.98); }

    /* ── FINAL SCREEN ───────────────────────────────────── */
    #screen-final { display: none; }
    .final-wrap { padding-top: 50px; text-align: center; }
    .final-emoji       { font-size: 4rem; margin-bottom: 16px; }
    .final-score-num   { font-size: 3rem; font-weight: 900; color: var(--blue); }
    .final-score-denom { font-size: 1.2rem; color: var(--text-muted); }
    .final-label       { color: var(--text-muted); margin: 8px 0 36px; font-size: 0.95rem; }

    .final-list-box {
      background: var(--surface); border-radius: 16px;
      padding: 16px; margin-bottom: 14px; text-align: left;
    }
    .final-list-title { font-weight: 700; margin-bottom: 10px; }
    .final-list-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-top: 1px solid var(--border);
      font-size: 0.88rem; color: var(--text-muted);
    }
    .dot-red   { color: var(--red);   font-size: 1.1rem; line-height: 1.4; }
    .dot-amber { color: var(--amber); font-size: 1.1rem; line-height: 1.4; }

    .final-buttons { display: flex; flex-direction: column; gap: 10px; }
    .btn-retry-failed {
      width:100%; padding:15px;
      background: var(--red); border:none;
      border-radius:14px; color:#fff;
      font-size:1rem; font-weight:700; cursor:pointer;
    }
    .btn-retry-diff {
      width:100%; padding:15px;
      background: var(--amber-dim);
      border: 2px solid var(--amber-border);
      border-radius:14px; color: var(--amber);
      font-size:1rem; font-weight:700; cursor:pointer;
    }
    .btn-restart {
      width:100%; padding:15px;
      background: var(--surface); border: 2px solid var(--border);
      border-radius:14px; color: var(--text-muted);
      font-size:1rem; font-weight:700; cursor:pointer;
    }

    /* ── SHAKE ──────────────────────────────────────────── */
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}   60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════ QUIZ SCREEN ══════════ -->
  <div id="screen-quiz">
    <div class="header">
      <span class="header-title">Conjugaison FR</span>
      <span class="header-meta" id="card-counter">1 / 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="card">
      <div class="tense-chip" id="q-tense">Présent</div>
      <div class="verb-name"  id="q-verb">Parler</div>
      <div id="q-person-wrap">
        <span class="person-label" id="q-person"></span>
      </div>
    </div>

    <div class="section-label">Quel groupe ?</div>
    <div class="group-buttons">
      <button class="btn-group" id="grp-1" onclick="selectGroup(1)">
        1<sup>er</sup><span class="group-sub">-er</span>
      </button>
      <button class="btn-group" id="grp-2" onclick="selectGroup(2)">
        2<sup>ème</sup><span class="group-sub">-ir / -iss-</span>
      </button>
      <button class="btn-group" id="grp-3" onclick="selectGroup(3)">
        3<sup>ème</sup><span class="group-sub">irréguliers</span>
      </button>
    </div>

    <div class="section-label">Ta conjugaison</div>
    <input type="text" id="answer-input"
      placeholder="ex : nous finissons / j'aurai / qu'il vienne…"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
      oninput="checkCanValidate()"
      onkeydown="if(event.key==='Enter')tryValidate()">

    <div class="accents">
      <button class="btn-accent" onclick="ins('é')">é</button>
      <button class="btn-accent" onclick="ins('è')">è</button>
      <button class="btn-accent" onclick="ins('ê')">ê</button>
      <button class="btn-accent" onclick="ins('ë')">ë</button>
      <button class="btn-accent" onclick="ins('à')">à</button>
      <button class="btn-accent" onclick="ins('â')">â</button>
      <button class="btn-accent" onclick="ins('î')">î</button>
      <button class="btn-accent" onclick="ins('ô')">ô</button>
      <button class="btn-accent" onclick="ins('û')">û</button>
      <button class="btn-accent" onclick="ins('ù')">ù</button>
      <button class="btn-accent" onclick="ins('ç')">ç</button>
      <button class="btn-accent" onclick="ins('œ')">œ</button>
    </div>

    <div class="help-panel" id="help-panel"></div>

    <div class="actions">
      <button class="btn-help" onclick="toggleHelp()">💡 Aide</button>
      <button class="btn-validate" id="btn-validate" onclick="tryValidate()">Valider</button>
    </div>
  </div>

  <!-- ══════════ RESULT SCREEN ══════════ -->
  <div id="screen-result">
    <div class="header">
      <span class="header-title">Conjugaison FR</span>
      <span class="header-meta" id="res-counter">1 / 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill-2"></div></div>

    <div class="result-badge" id="result-badge"></div>

    <div class="result-block">
      <div class="result-block-title">Résultat</div>
      <div id="result-rows"></div>
    </div>

    <div class="tense-explain" id="tense-explain"></div>

    <div class="group-explain" id="group-explain">
      <div class="group-explain-label" id="group-explain-label">📚 Groupe</div>
      <div id="group-explain-text"></div>
    </div>

    <div class="card-back-section">
      <div class="card-back-title">Verso de la carte Anki</div>
      <div class="card-back-content" id="card-back-content"></div>
    </div>

    <div class="result-actions">
      <button class="btn-difficult" id="btn-difficult" onclick="toggleDifficult()">⚑ Difficile</button>
      <button class="btn-next" id="btn-next" onclick="nextCard()">→ Suivante</button>
    </div>
  </div>

  <!-- ══════════ FINAL SCREEN ══════════ -->
  <div id="screen-final">
    <div class="final-wrap">
      <div class="final-emoji" id="final-emoji">🎉</div>
      <div>
        <span class="final-score-num"   id="final-num">0</span>
        <span class="final-score-denom" id="final-denom"> / 10 correctes</span>
      </div>
      <div class="final-label">accents compris</div>

      <div class="final-list-box" id="failed-box" style="display:none">
        <div class="final-list-title">❌ À revoir :</div>
        <div id="failed-list"></div>
      </div>

      <div class="final-list-box" id="diff-box" style="display:none">
        <div class="final-list-title">⚑ Marquées difficiles :</div>
        <div id="diff-list"></div>
      </div>

      <div class="final-buttons">
        <button class="btn-retry-failed" id="btn-retry-failed" style="display:none" onclick="retryFailed()">↩ Reprendre les ratées</button>
        <button class="btn-retry-diff"   id="btn-retry-diff"   style="display:none" onclick="retryDifficult()">⚑ Réviser les difficiles</button>
        <button class="btn-restart" onclick="restart()">↺ Tout recommencer (aléatoire)</button>
      </div>
    </div>
  </div>

</div>
<script>

// ════════════════════════════════════════════════════════
//  AIDE PAR TEMPS
// ════════════════════════════════════════════════════════

const TENSE_HELP = {
  "Présent": `
    <div class="help-tense-title">Indicatif Présent ★★★</div>
    <div class="help-employ">Action en cours, habituelle ou vérité générale.</div>
    <div class="help-ex">Il rédige le rapport.<br>Je travaille tous les matins.<br>Le soleil se lève à l'est.</div>`,

  "Imparfait": `
    <div class="help-tense-title">Imparfait ★★★</div>
    <div class="help-employ">Action passée <b>durable</b>, <b>habituelle</b> ou <b>descriptive</b>.</div>
    <div class="help-ex">Il travaillait tous les soirs.<br>Quand j'étais enfant, je jouais dehors.</div>
    <div class="help-rule">📌 Discours indirect : présent → imparfait</div>
    <div class="help-ex">Il a dit qu'il <b>finissait</b>. (= « Je finis. »)</div>`,

  "Futur simple": `
    <div class="help-tense-title">Futur simple ★★</div>
    <div class="help-employ">Action à venir, certaine ou planifiée.</div>
    <div class="help-ex">Nous enverrons le dossier lundi.<br>Il sera en retard.</div>
    <div class="help-rule">📌 si + présent → futur simple</div>
    <div class="help-ex">Si tu travailles, tu <b>réussiras</b>.</div>
    <div class="help-warning">⚠ Jamais : <i>si + futur</i></div>`,

  "Passé simple": `
    <div class="help-tense-title">Passé simple ★ (écrit soutenu)</div>
    <div class="help-employ">Action passée <b>achevée et délimitée</b>, sans lien avec le présent.</div>
    <div class="help-ex">Il prit la parole.<br>Elle annonça les résultats.</div>
    <div class="help-rule">📌 Récits littéraires et historiques. À l'oral → passé composé.</div>`,

  "Conditionnel présent": `
    <div class="help-tense-title">Conditionnel présent ★★★</div>
    <div class="help-employ">① <b>Hypothèse</b> (condition non réalisée)</div>
    <div class="help-ex">Si tu travaillais davantage, tu <b>réussirais</b>.</div>

// ════════════════════════════════════════════════════════
//  CARTES DIFFICILES — persistance localStorage
// ════════════════════════════════════════════════════════

const LS_KEY = 'conjugaison_difficult';

function cardId(c) {
  return c.verb + '|' + c.tense + '|' + (c.person ?? '');
}

function loadDifficult() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); }
  catch { return new Set(); }
}

function saveDifficult(set) {
  localStorage.setItem(LS_KEY, JSON.stringify([...set]));
}

let difficultIds = loadDifficult();

// ════════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════════

let queue        = [];
let current      = 0;
let totalCards   = 0;
let score        = 0;
let failedCards  = [];
let selectedGroup= null;
let helpOpen     = false;

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start(cards) {
  queue        = shuffle(cards);
  current      = 0;
  totalCards   = queue.length;
  score        = 0;
  failedCards  = [];
  selectedGroup= null;
  helpOpen     = false;
  showCard();
}

function restart()        { start(CARDS); }
function retryFailed()    { start(failedCards.slice()); }
function retryDifficult() {
  const diff = CARDS.filter(c => difficultIds.has(cardId(c)));
  if (diff.length > 0) start(diff);
}

// ════════════════════════════════════════════════════════
//  AFFICHAGE CARTE
// ════════════════════════════════════════════════════════

function showCard() {
  const c = queue[current];

  selectedGroup = null;
  helpOpen      = false;

  const inp = document.getElementById('answer-input');
  inp.value = '';
  inp.classList.remove('shake');
  document.getElementById('btn-validate').classList.add('inactive');
  document.getElementById('help-panel').classList.remove('visible');
  document.getElementById('help-panel').innerHTML = TENSE_HELP[c.tense] || '';

  [1,2,3].forEach(g => document.getElementById('grp-'+g).classList.remove('selected'));

  document.getElementById('q-tense').textContent = c.tense;
  document.getElementById('q-verb').textContent  = c.verb;

  const personWrap = document.getElementById('q-person-wrap');
  if (c.person) {
    personWrap.style.display = '';
    document.getElementById('q-person').textContent = c.person;
  } else {
    personWrap.style.display = 'none';
  }

  updateProgress();
  showScreen('screen-quiz');
  setTimeout(() => inp.focus(), 50);
}

// ════════════════════════════════════════════════════════
//  INTERACTIONS QUIZ
// ════════════════════════════════════════════════════════

function selectGroup(n) {
  selectedGroup = n;
  [1,2,3].forEach(g => document.getElementById('grp-'+g).classList.toggle('selected', g === n));
  checkCanValidate();
}

function checkCanValidate() {
  const hasText = document.getElementById('answer-input').value.trim().length > 0;
  const ready   = hasText && selectedGroup !== null;
  document.getElementById('btn-validate').classList.toggle('inactive', !ready);
}

function tryValidate() {
  const hasText = document.getElementById('answer-input').value.trim().length > 0;
  if (!hasText) {
    const inp = document.getElementById('answer-input');
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    inp.focus();
    return;
  }
  if (selectedGroup === null) {
    const grpBtns = document.querySelector('.group-buttons');
    grpBtns.classList.remove('pulse'); void grpBtns.offsetWidth; grpBtns.classList.add('pulse');
    return;
  }
  validate();
}

function toggleHelp() {
  helpOpen = !helpOpen;
  document.getElementById('help-panel').classList.toggle('visible', helpOpen);
}

function ins(char) {
  const inp   = document.getElementById('answer-input');
  const s     = inp.selectionStart ?? inp.value.length;
  const e     = inp.selectionEnd   ?? inp.value.length;
  inp.value   = inp.value.slice(0, s) + char + inp.value.slice(e);
  inp.setSelectionRange(s + 1, s + 1);
  inp.focus();
  checkCanValidate();
}

// ════════════════════════════════════════════════════════
//  VALIDATION
// ════════════════════════════════════════════════════════

function validate() {
  const c       = queue[current];
  const userRaw = document.getElementById('answer-input').value.trim();
  const norm = s => s.trim().toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/\s+/g,' ');
  const conjOk  = norm(userRaw) === norm(c.answer);
  const groupOk = selectedGroup === c.group;

  if (conjOk) score++;
  else {
    failedCards.push(c);
    const inp = document.getElementById('answer-input');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
  }

  // Badge (basé sur la conjugaison)
  const badge = document.getElementById('result-badge');
  badge.className = 'result-badge ' + (conjOk ? 'correct' : 'incorrect');
  badge.innerHTML = conjOk
    ? '✓ Correct !'
    : `✗ Incorrect<span class="result-sub">${userRaw} → <b>${c.answer}</b></span>`;

  // Lignes résultat
  const groupLabel = selectedGroup === 1 ? '1er' : selectedGroup + 'ème';
  document.getElementById('result-rows').innerHTML = `
    <div class="result-row">
      <span class="result-row-label">Conjugaison</span>
      <span class="result-row-val ${conjOk ? 'ok' : 'ko'}">
        ${conjOk ? c.answer + ' ✓' : '<del>' + userRaw + '</del> → ' + c.answer}
      </span>
    </div>
    <div class="result-row">
      <span class="result-row-label">Groupe</span>
      <span class="result-row-val ${groupOk ? 'ok' : 'ko'}">
        ${groupOk ? c.groupName + ' ✓' : groupLabel + ' ✗ → ' + c.groupName}
      </span>
    </div>`;

  // Emploi du temps
  document.getElementById('tense-explain').innerHTML = TENSE_HELP[c.tense] || '';

  // Explication groupe
  document.getElementById('group-explain-label').textContent = '📚 ' + c.groupName;
  document.getElementById('group-explain-text').innerHTML    = c.groupExplain;

  // Verso Anki
  document.getElementById('card-back-content').innerHTML = c.cardBack;

  // Bouton Difficile
  updateDifficultButton(difficultIds.has(cardId(c)));

  // Progression
  updateProgress();
  document.getElementById('res-counter').textContent      = (current + 1) + ' / ' + totalCards;
  document.getElementById('progress-fill-2').style.width = ((current + 1) / totalCards * 100) + '%';
  document.getElementById('btn-next').textContent =
    current + 1 >= totalCards ? '→ Résultats' : '→ Suivante';

  showScreen('screen-result');
}

// ════════════════════════════════════════════════════════
//  DIFFICILE
// ════════════════════════════════════════════════════════

function updateDifficultButton(marked) {
  const btn = document.getElementById('btn-difficult');
  btn.classList.toggle('marked', marked);
  btn.textContent = marked ? '⚑ Difficile ✓' : '⚑ Difficile';
}

function toggleDifficult() {
  const c  = queue[current];
  const id = cardId(c);
  if (difficultIds.has(id)) difficultIds.delete(id);
  else                       difficultIds.add(id);
  saveDifficult(difficultIds);
  updateDifficultButton(difficultIds.has(id));
}

// ════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════

function nextCard() {
  current++;
  if (current >= totalCards) showFinal();
  else showCard();
}

function showFinal() {
  document.getElementById('final-num').textContent   = score;
  document.getElementById('final-denom').textContent = ' / ' + totalCards + ' correctes';

  const ratio = score / totalCards;
  document.getElementById('final-emoji').textContent =
    ratio >= 0.9 ? '🎉' : ratio >= 0.7 ? '👏' : ratio >= 0.5 ? '💪' : '📚';

  // Ratées
  const failedBox  = document.getElementById('failed-box');
  const btnFailed  = document.getElementById('btn-retry-failed');
  if (failedCards.length > 0) {
    failedBox.style.display = '';
    btnFailed.style.display = '';
    document.getElementById('failed-list').innerHTML = failedCards.map(c =>
      `<div class="final-list-item">
        <span class="dot-red">✗</span>
        <span><b>${c.verb}</b> — ${c.tense}${c.person ? ' · ' + c.person : ''} → <b>${c.answer}</b></span>
      </div>`).join('');
  } else {
    failedBox.style.display = 'none';
    btnFailed.style.display = 'none';
  }

  // Difficiles (persistantes, indépendantes de la session)
  const diffCards = CARDS.filter(c => difficultIds.has(cardId(c)));
  const diffBox   = document.getElementById('diff-box');
  const btnDiff   = document.getElementById('btn-retry-diff');
  if (diffCards.length > 0) {
    diffBox.style.display = '';
    btnDiff.style.display = '';
    document.getElementById('diff-list').innerHTML = diffCards.map(c =>
      `<div class="final-list-item">
        <span class="dot-amber">⚑</span>
        <span><b>${c.verb}</b> — ${c.tense}${c.person ? ' · ' + c.person : ''}</span>
      </div>`).join('');
  } else {
    diffBox.style.display = 'none';
    btnDiff.style.display = 'none';
  }

  showScreen('screen-final');
}

// ════════════════════════════════════════════════════════
//  UTILITAIRES
// ════════════════════════════════════════════════════════

function showScreen(id) {
  ['screen-quiz','screen-result','screen-final'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
  window.scrollTo(0, 0);
}

function updateProgress() {
  document.getElementById('progress-fill').style.width = (current / totalCards * 100) + '%';
  document.getElementById('card-counter').textContent  = (current + 1) + ' / ' + totalCards;
}

start(CARDS);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
